
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucky Jet</title>
  <style>
    html { 
      background: url(https://s4.gifyu.com/images/bLK8G.gif) no-repeat center center fixed; 
      background-size: cover;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0 0 0;
    } 

    .logo img {
      width: auto;
      height: auto;
      transform: scale(0.55);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #ffffff;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      backdrop-filter: blur(2px);
    } 

    h2 {
      font-size: 16px;
      color: #a89ff0;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background: linear-gradient(135deg, #6f00ff, #00c3ff);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 195, 255, 0.4);
      width: 180px;
      margin: 0 auto;
    }

    button:disabled {
      background: #333;
      cursor: not-allowed;
      box-shadow: none;
    }

    button:hover:enabled {
      transform: scale(1.04);
      box-shadow: 0 0 25px rgba(0, 195, 255, 0.8);
    }

    #result {
      margin-top: 25px;
      font-size: 28px;
      font-weight: bold;
      color: #b662fc;
      text-shadow: 0 0 10px #9450f4;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes glow {
      0%, 100% {
        color: #ffffff;
        text-shadow: 0 0 10px #ffffff;
      }
      50% {
        color: #cccccc;
        text-shadow: 0 0 20px #ffffff;
      }
    }

    .blinking {
      animation: blink 0.6s infinite;
    }

    .glowing {
      animation: glow 1.2s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <h1 class="logo">
    <img src="https://i.ibb.co/kVpX6PdG/IMG-8090-Photoroom.png" alt="Lucky Jet" />
  </h1>
  <h2><a href="https://t.me/+0Rd6Cr6oFA8yZmIx" style="text-decoration: none; color: #a89ff0;" target="_blank">🔗 by Gambit Abuse 🔗</a></h2>

  <button id="forecastBtn" onclick="generateForecast()">🎯 <b>Прогноз</b></button>

  <div id="result">
    <img src="https://i.ibb.co/WmsVTTD/Rocket.webp" alt="rocket" style="width: 24px; vertical-align: middle; margin-right: 1px; transform: scale(1.1);" />
    <span>Следующий коэффициент: <b id="koef">–</b></span>
  </div>

  <script>
    const btn = document.getElementById("forecastBtn");
    const koef = document.getElementById("koef");
    let cooldown = false;
    const cooldownTime = 15;

    function generateRealisticCoefficient() {
      const roll = Math.random();

      if (roll < 0.60) {
        return +(Math.random() * (4.00 - 1.00) + 1.00).toFixed(2);
      } else if (roll < 0.80) {
        return +(Math.random() * (20.00 - 4.00) + 4.00).toFixed(2);
      } else if (roll < 0.985) {
        return +(Math.random() * (100.00 - 20.00) + 20.00).toFixed(2);
      } else if (roll < 0.995) {
        return +(Math.random() * (1000.00 - 100.00) + 100.00).toFixed(2);
      } else {
        return +(Math.random() * (20000.00 - 1000.00) + 1000.00).toFixed(2);
      }
    }

    function generateForecast() {
      if (cooldown) return;

      btn.disabled = true;
      cooldown = true;

      let dots = 0;
      btn.innerHTML = "<b>Вычисление</b>";

      const dotsInterval = setInterval(() => {
        dots = (dots + 1) % 4;
        btn.innerHTML = "<b>Вычисление" + ".".repeat(dots) + "</b>";
      }, 500);

      const target = generateRealisticCoefficient();
      let current = 1.00;

      koef.textContent = `${current.toFixed(2)}x`;
      koef.classList.remove("glowing");
      koef.classList.add("blinking");

      const steps = 60;
      const duration = 2500;
      const increment = (target - current) / steps;
      let count = 0;

      const anim = setInterval(() => {
        current += increment;
        count++;
        koef.textContent = `${current.toFixed(2)}x`;

        if (count >= steps) {
          clearInterval(anim);
          clearInterval(dotsInterval);

          koef.textContent = `${target.toFixed(2)}x`;
          koef.classList.remove("blinking");
          koef.classList.add("glowing");

          startCooldown();
        }
      }, duration / steps);
    }

    function startCooldown() {
      let countdown = cooldownTime;
      btn.innerHTML = `⏳ <b>${countdown}s</b>`;

      const interval = setInterval(() => {
        countdown--;
        btn.innerHTML = `⏳ <b>${countdown}s</b>`;
        if (countdown <= 0) {
          clearInterval(interval);
          cooldown = false;
          btn.disabled = false;
          btn.innerHTML = "🎯 <b>Прогноз</b>";
          koef.classList.remove("glowing");
        }
      }, 1000);
    }
  </script>

</body>
</html>
